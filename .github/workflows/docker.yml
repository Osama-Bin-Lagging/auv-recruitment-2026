name: Build and publish image

# Publishes ghcr.io/<owner>/auv-recruitment:2026 for amd64 and arm64.
#
# Each architecture builds on a NATIVE runner rather than under QEMU. That
# matters: the arm64 layer compiles ros_gz from source (no arm64 Debian package
# exists), which takes ~15 minutes natively and would take hours emulated --
# plausibly past the 6-hour job limit. Free arm64 runners are available to
# public repositories, which is what makes this viable.
#
# No personal access token: GITHUB_TOKEN is issued automatically and the
# `packages: write` permission below is all it needs.

on:
  push:
    branches: [main]
    paths:
      - 'docker/**'
      - '.github/workflows/docker.yml'
  workflow_dispatch:        # lets you trigger a rebuild by hand

env:
  REGISTRY: ghcr.io
  TAG: 2026
  # IMAGE is computed per job: Docker refs must be lowercase, and
  # github.repository_owner preserves the account's original casing.

jobs:
  build:
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false      # a broken arm64 build should not bin a good amd64 one
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            arch: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64
    steps:
      - uses: actions/checkout@v4

      - name: Compute lowercase image name
        env:
          OWNER: ${{ github.repository_owner }}
        run: echo "IMAGE=$(echo "$OWNER/auv-recruitment" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ./docker
          file: ./docker/Dockerfile
          platforms: ${{ matrix.platform }}
          # arm64 compiles ros_gz from source, so cache aggressively -- an
          # unchanged Dockerfile should not pay that cost twice.
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true

      - name: Save digest
        run: |
          mkdir -p /tmp/digests
          echo "${{ steps.build.outputs.digest }}" > /tmp/digests/${{ matrix.arch }}

      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.arch }}
          path: /tmp/digests/${{ matrix.arch }}
          retention-days: 1

  merge:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - name: Compute lowercase image name
        env:
          OWNER: ${{ github.repository_owner }}
        run: echo "IMAGE=$(echo "$OWNER/auv-recruitment" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create the multi-arch manifest
        run: |
          set -e
          REFS=""
          for f in /tmp/digests/*; do
            REFS="$REFS ${REGISTRY}/${IMAGE}@$(cat $f)"
          done
          echo "combining:$REFS"
          docker buildx imagetools create -t ${REGISTRY}/${IMAGE}:${TAG} $REFS

      - name: Show the result
        run: docker buildx imagetools inspect ${REGISTRY}/${IMAGE}:${TAG}
